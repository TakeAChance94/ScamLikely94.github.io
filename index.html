<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Take A Chance</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍀</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      height: 100dvh;
    }
    body {
      background: #0c0c0c;
      color: #d4d4d4;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
      font-size: 15px;
      line-height: 1.5;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      -webkit-text-size-adjust: 100%;
    }
    #terminal {
      width: 100%;
      max-width: 820px;
      height: min(90vh, 620px);
      height: min(90dvh, 620px);
      background: #111;
      border: 1px solid #333;
      border-radius: 10px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .titlebar {
      background: #1a1a1a;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #333;
      user-select: none;
      flex-shrink: 0;
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .dot.red { background: #ff5f56; }
    .dot.yellow { background: #ffbd2e; }
    .dot.green { background: #27c93f; }
    .title { flex: 1; text-align: center; color: #888; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #output {
      flex: 1;
      padding: 18px 20px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
    }
    .line { margin-bottom: 2px; }
    .prompt { color: #7ee787; }
    .cmd { color: #e6edf3; }
    .error { color: #ff7b72; }
    .info { color: #79c0ff; }
    .muted { color: #8b949e; }
    #input-line {
      display: flex;
      padding: 12px 16px 16px;
      align-items: center;
      border-top: 1px solid #222;
      flex-shrink: 0;
      gap: 6px;
    }
    #prompt-text {
      color: #7ee787;
      white-space: nowrap;
      flex-shrink: 0;
      font-size: 0.95em;
    }
    #cmd-input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: #e6edf3;
      font-family: inherit;
      font-size: 16px; /* prevents iOS zoom on focus */
      caret-color: #7ee787;
      -webkit-appearance: none;
      border-radius: 0;
    }
    a { color: #79c0ff; text-decoration: underline; }
    a:hover { opacity: 0.85; }

    /* Mobile */
    @media (max-width: 600px) {
      body {
        padding: 0;
        align-items: stretch;
      }
      #terminal {
        max-width: none;
        height: 100%;
        height: 100dvh;
        max-height: none;
        border-radius: 0;
        border: none;
        box-shadow: none;
      }
      .titlebar {
        padding: 12px 14px;
        padding-top: max(12px, env(safe-area-inset-top));
      }
      .title { font-size: 12px; }
      #output {
        padding: 14px 14px;
        font-size: 14px;
      }
      #input-line {
        padding: 12px 14px;
        padding-bottom: max(14px, env(safe-area-inset-bottom));
      }
      #prompt-text {
        font-size: 13px;
        max-width: 45%;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    }
  </style>
</head>
<body>
  <div id="terminal">
    <div class="titlebar">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
      <div class="title">visitor@takeachance — zsh</div>
    </div>
    <div id="output"></div>
    <div id="input-line">
      <span id="prompt-text">visitor@takeachance:~$</span>
      <input id="cmd-input" type="text" autocomplete="off" autofocus spellcheck="false">
    </div>
  </div>

  <script src="static/js/script.js"></script>
</body>
</html>

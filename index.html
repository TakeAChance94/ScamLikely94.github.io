<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>terminal — [Your Name]</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0c0c0c;
      color: #d4d4d4;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
      font-size: 15px;
      line-height: 1.5;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #terminal {
      width: 100%;
      max-width: 820px;
      height: 90vh;
      max-height: 620px;
      background: #111;
      border: 1px solid #333;
      border-radius: 10px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .titlebar {
      background: #1a1a1a;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #333;
      user-select: none;
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot.red { background: #ff5f56; }
    .dot.yellow { background: #ffbd2e; }
    .dot.green { background: #27c93f; }
    .title { flex: 1; text-align: center; color: #888; font-size: 13px; }
    #output {
      flex: 1;
      padding: 18px 20px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .line { margin-bottom: 2px; }
    .prompt { color: #7ee787; }
    .cmd { color: #e6edf3; }
    .error { color: #ff7b72; }
    .info { color: #79c0ff; }
    .muted { color: #8b949e; }
    #input-line {
      display: flex;
      padding: 12px 20px 18px;
      align-items: center;
      border-top: 1px solid #222;
    }
    #prompt-text { color: #7ee787; margin-right: 8px; white-space: nowrap; }
    #cmd-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e6edf3;
      font-family: inherit;
      font-size: inherit;
      caret-color: #7ee787;
    }
    .cursor {
      display: inline-block;
      width: 8px;
      height: 1.1em;
      background: #7ee787;
      animation: blink 1s step-end infinite;
      vertical-align: text-bottom;
      margin-left: 1px;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
    a { color: #79c0ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div id="terminal">
    <div class="titlebar">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
      <div class="title">visitor@site — zsh</div>
    </div>
    <div id="output"></div>
    <div id="input-line">
      <span id="prompt-text">visitor@site:~$</span>
      <input id="cmd-input" type="text" autocomplete="off" autofocus spellcheck="false">
    </div>
  </div>

  <script src="static/js/script.js"></script>
</body>
</html>
